<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
<style>
  /* Layer 0: camera feed */
  #cam-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; opacity: 0.55;
  }
  /* Layer 1: particles (transparent bg) */
  #sim-canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 1; pointer-events: none;
  }
  /* Layer 2: hand skeleton overlay */
  #hand-overlay {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
  }
  /* Hidden video — MediaPipe source only */
  #video-src { display: none; }
  /* All UI floats on top */
  .ui { position: fixed; z-index: 20; }
  /* Top-left: sim name */
  #sim-title { top: 22px; left: 80px; }
  /* Top-center: guided prompt */
  #sim-prompt {
    top: 22px; left: 50%; transform: translateX(-50%);
    border: 1.5px solid #111; padding: 12px 24px;
    text-align: center; font-size: 0.95rem; max-width: 380px;
    background: rgba(255,255,255,0.88); line-height: 1.5; white-space: normal;
  }
  /* Top-right: gesture legend */
  #legend {
    top: 16px; right: 22px;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,0.88); padding: 10px 12px;
  }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: #222; }
  .legend-row svg { flex-shrink: 0; }
  /* Parameter panel — bottom-right */
  #param-panel {
    bottom: 20px; right: 22px; width: 210px;
    background: rgba(255,255,255,0.88); padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .param-row { display: flex; flex-direction: column; gap: 3px; }
  .param-name { font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: #888; }
  .param-value { font-size: 12px; color: #222; letter-spacing: 0.03em; }
  .param-bar-wrap { height: 2px; background: rgba(0,0,0,0.08); border-radius: 1px; overflow: hidden; }
  .param-bar { height: 100%; background: rgba(0,0,0,0.35); border-radius: 1px; transition: width 0.1s linear; }
  /* Formation label */
  #formation-label {
    position: fixed; pointer-events: none; text-align: center;
    z-index: 15; transition: opacity 0.6s ease; opacity: 0;
  }
  #formation-symbol { font-size: 22px; color: rgba(255,255,255,0.80); display: block; line-height: 1; }
  #formation-name {
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); margin-top: 4px; display: block; white-space: nowrap;
  }
  /* Stamps */
  #stamps-layer { position: fixed; inset: 0; z-index: 14; pointer-events: none; }
  .stamp { position: absolute; pointer-events: none; text-align: center; animation: stamp-in 1.2s ease forwards; }
  @keyframes stamp-in {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(1.6); }
    40%  { opacity:1; transform:translate(-50%,-50%) scale(0.92); }
    60%  { transform:translate(-50%,-50%) scale(1.04); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  .stamp-symbol { font-size: 18px; color: rgba(255,255,255,0.50); display: block; line-height: 1; }
  .stamp-name {
    font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase;
    color: rgba(255,255,255,0.30); margin-top: 4px; display: block; white-space: nowrap;
  }
  .stamp::before {
    content: ''; position: absolute; top: 50%; left: 50%;
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,0.20); transform: translate(-50%,-50%);
  }
  /* Buttons */
  #btn-explore { bottom: 30px; left: 30px; }
  #btn-save    { bottom: 30px; left: 30px; display: none; }
  /* Hand guides */
  .hand-guide { bottom: 60px; opacity: 0.12; pointer-events: none; }
  #guide-left  { left: 60px; }
  #guide-right { right: 60px; }
</style>
</head>

    <circle cx="65" cy="34" r="5" stroke="white" stroke-width="1.5" fill="none"/>

<script src="shared.js"></script>
<script>
injectFlash();

// ═══════════════════════════════════════════════════════════
// PROMPT SYSTEM
// ═══════════════════════════════════════════════════════════
const sim = getSim();
document.getElementById('sim-title').textContent = sim;

const prompts = {
  'Celestial Bodies': [
    'Pinch your left hand to increase gravity and collapse matter.',
    'Tilt your right hand to set the angular momentum — create rotation.',
    'Shake your right hand vigorously to inject turbulence.',
    'Move your left hand to shift the mass location.',
  ],
  'Electricity': [
    'Point your index finger to draw a current path.',
    'Shake your hand to generate a charge burst.',
    'Pinch both hands to close the circuit.',
    'Rotate your wrist to spin the magnetic field.',
  ],
  'Waves': [
    'Move your hand up and down to create a wave.',
    'Change distance between hands to adjust frequency.',
    'Shake both hands for a standing wave interference.',
    'Rotate slowly to shift the phase of the wave.',
  ],
};

let promptIdx = 0, promptTimer = null, freeplay = false;

function showPrompt() {
  const box = document.getElementById('sim-prompt');
  const btnExplore = document.getElementById('btn-explore');
  const btnSave    = document.getElementById('btn-save');
  if (freeplay) {
    box.style.display        = 'none';
    btnExplore.style.display = 'none';
    btnSave.style.display    = 'block';
    return;
  }
  const list = prompts[sim] || prompts['Celestial Bodies'];
  box.textContent = list[promptIdx % list.length];
  btnExplore.style.display = 'block';
  btnSave.style.display    = 'none';
  clearTimeout(promptTimer);
  promptTimer = setTimeout(() => { promptIdx++; showPrompt(); }, 6000);
}
function enterFreeplay() { freeplay = true; showPrompt(); }
function saveExperiment() { flash('Experiment saved!'); }
showPrompt();

// ═══════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════
const camCanvas     = document.getElementById('cam-canvas');
const camCtx        = camCanvas.getContext('2d');
const simCanvas     = document.getElementById('sim-canvas');
const ctx           = simCanvas.getContext('2d');
const handOverlay   = document.getElementById('hand-overlay');
const handCtx       = handOverlay.getContext('2d');
const video         = document.getElementById('video-src');

function resize() {
  camCanvas.width   = simCanvas.width   = handOverlay.width  = window.innerWidth;
  camCanvas.height  = simCanvas.height  = handOverlay.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initParticles(); });

// ═══════════════════════════════════════════════════════════
// SIMULATION PARAMETERS
// ═══════════════════════════════════════════════════════════
const params = {
  collapseStrength: 0.0,
  angularMomentum:  0.0,
  turbulence:       0.0,
  massX:            0.5,
  massY:            0.5,
  massAmount:       1.0,
};
function smooth(c, t, k) { return c + (t - c) * k; }

// ═══════════════════════════════════════════════════════════
// PARTICLES
// ═══════════════════════════════════════════════════════════
const NUM = 1200;
let particles = [];

function initParticles() {
  particles = [];
  const cx = simCanvas.width / 2, cy = simCanvas.height / 2;
  const spread = Math.min(simCanvas.width, simCanvas.height) * 0.40;
  for (let i = 0; i < NUM; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 0.5) * spread;
    particles.push({
      x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r,
      vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
    });
  }
  ignitionLevel    = 0;
  currentFormation = null;
  formationAge     = 0;
  clumpX = simCanvas.width  / 2;
  clumpY = simCanvas.height / 2;
  clearStamps();
  ctx.clearRect(0, 0, simCanvas.width, simCanvas.height);
}

// ═══════════════════════════════════════════════════════════
// PERLIN NOISE 2D
// ═══════════════════════════════════════════════════════════
const P = new Uint8Array(512);
for (let i = 0; i < 256; i++) P[i] = i;
for (let i = 255; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [P[i], P[j]] = [P[j], P[i]]; }
for (let i = 0; i < 256; i++) P[i + 256] = P[i];
const fade = t => t*t*t*(t*(t*6-15)+10);
const lrp  = (a, b, t) => a + t * (b - a);
const g2   = (h, x, y) => { const u = h < 2 ? x : y, v = h < 2 ? y : x; return (h&1 ? -u : u) + (h&2 ? -v : v); };
function noise2(x, y) {
  const xi = Math.floor(x)&255, yi = Math.floor(y)&255;
  const xf = x - Math.floor(x),  yf = y - Math.floor(y);
  const u = fade(xf), v = fade(yf);
  return lrp(
    lrp(g2(P[P[xi]+yi], xf, yf),     g2(P[P[xi+1]+yi], xf-1, yf),     u),
    lrp(g2(P[P[xi]+yi+1], xf, yf-1), g2(P[P[xi+1]+yi+1], xf-1, yf-1), u), v);
}

// ═══════════════════════════════════════════════════════════
// FORMATION CLASSIFIER
// ═══════════════════════════════════════════════════════════
const FORMATIONS = [
  { id:'black_hole',      name:'Black Hole',      symbol:'◉', test: p => p.collapseStrength > 0.82 && p.turbulence < 0.15 && Math.abs(p.angularMomentum) < 0.20 },
  { id:'neutron_star',    name:'Neutron Star',    symbol:'✦', test: p => p.collapseStrength > 0.70 && p.turbulence < 0.30 && Math.abs(p.angularMomentum) < 0.35 },
  { id:'star',            name:'Star',            symbol:'☀', test: p => p.collapseStrength > 0.55 && p.turbulence < 0.40 && Math.abs(p.angularMomentum) < 0.50 },
  { id:'protostar',       name:'Protostar',       symbol:'✧', test: p => p.collapseStrength > 0.35 && p.turbulence < 0.45 },
  { id:'spiral_galaxy',   name:'Spiral Galaxy',   symbol:'𝌀', test: p => Math.abs(p.angularMomentum) > 0.60 && p.collapseStrength > 0.30 && p.turbulence < 0.45 },
  { id:'accretion_disc',  name:'Accretion Disc',  symbol:'⊙', test: p => Math.abs(p.angularMomentum) > 0.40 && p.collapseStrength > 0.20 },
  { id:'nebula',          name:'Nebula',          symbol:'❋', test: p => p.turbulence > 0.55 && p.collapseStrength > 0.20 },
  { id:'molecular_cloud', name:'Molecular Cloud', symbol:'∿', test: p => p.turbulence > 0.40 && p.collapseStrength < 0.30 },
  { id:'planet',          name:'Planet',          symbol:'◯', test: p => p.collapseStrength > 0.15 && p.collapseStrength < 0.50 && p.turbulence < 0.25 && Math.abs(p.angularMomentum) < 0.30 },
  { id:'dust_cloud',      name:'Dust Cloud',      symbol:'·', test: p => p.collapseStrength < 0.10 && p.turbulence < 0.15 },
];
function classifyFormation(p) { for (const f of FORMATIONS) { if (f.test(p)) return f; } return null; }

// ═══════════════════════════════════════════════════════════
// STAMPS
// ═══════════════════════════════════════════════════════════
const stampsLayer = document.getElementById('stamps-layer');
const stamps = [];
let lastStampedId = null;

function addStamp(formation, x, y) {
  for (const s of stamps) {
    if (s.formationId === formation.id && Math.hypot(s.x - x, s.y - y) < 40) return;
  }
  const el = document.createElement('div');
  el.className = 'stamp';
  el.style.left = x + 'px'; el.style.top = y + 'px';
  el.innerHTML = `<span class="stamp-symbol">${formation.symbol}</span><span class="stamp-name">${formation.name}</span>`;
  stampsLayer.appendChild(el);
  stamps.push({ el, x, y, formationId: formation.id });
}
function clearStamps() { stamps.length = 0; stampsLayer.innerHTML = ''; lastStampedId = null; }

// ═══════════════════════════════════════════════════════════
// SIMULATION STATE
// ═══════════════════════════════════════════════════════════
let ignitionLevel = 0, noiseT = 0;
let currentFormation = null, formationAge = 0;
const FORMATION_CONFIRM = 40;
let clumpX = 0, clumpY = 0;

function computeClumpCentroid(attractorX, attractorY) {
  const r = Math.min(simCanvas.width, simCanvas.height) * 0.18;
  let sx = 0, sy = 0, count = 0;
  for (const p of particles) {
    const dx = p.x - attractorX, dy = p.y - attractorY;
    if (dx*dx + dy*dy < r*r) { sx += p.x; sy += p.y; count++; }
  }
  if (count > 10) {
    clumpX += (sx / count - clumpX) * 0.12;
    clumpY += (sy / count - clumpY) * 0.12;
  } else {
    clumpX += (attractorX - clumpX) * 0.06;
    clumpY += (attractorY - clumpY) * 0.06;
  }
}

// ═══════════════════════════════════════════════════════════
// PHYSICS TICK
// ═══════════════════════════════════════════════════════════
function tick() {
  noiseT += 0.004;
  const mx = params.massX * simCanvas.width;
  const my = params.massY * simCanvas.height;
  const G     = 380 * params.collapseStrength * params.massAmount;
  const EPS2  = 55;
  const omega = params.angularMomentum * 4.2;
  const turb  = params.turbulence * 3.5;
  const damp  = 0.974;

  for (const p of particles) {
    const dx = mx - p.x, dy = my - p.y;
    const d2 = dx*dx + dy*dy + EPS2;
    const d  = Math.sqrt(d2);
    const f  = G / d2;
    p.vx += (dx / d) * f;
    p.vy += (dy / d) * f;
    if (omega !== 0) {
      p.vx += (-dy / d) * omega * f * 0.48;
      p.vy += ( dx / d) * omega * f * 0.48;
    }
    if (turb > 0.01) {
      const ang = noise2(p.x * 0.003 + noiseT, p.y * 0.003) * Math.PI * 4;
      p.vx += Math.cos(ang) * turb * 0.09;
      p.vy += Math.sin(ang) * turb * 0.09;
    }
    p.vx *= damp; p.vy *= damp;
    p.x  += p.vx; p.y  += p.vy;
    if (p.x < -60)                        p.x = simCanvas.width  + 60;
    else if (p.x > simCanvas.width  + 60) p.x = -60;
    if (p.y < -60)                        p.y = simCanvas.height + 60;
    else if (p.y > simCanvas.height + 60) p.y = -60;
  }

  computeClumpCentroid(mx, my);
  const isIgniting = ['star','neutron_star','black_hole'].includes(currentFormation?.id);
  const ignitionTarget = isIgniting ? params.collapseStrength * params.massAmount : 0;
  ignitionLevel = smooth(ignitionLevel, ignitionTarget * 0.9, 0.04);
}

// ═══════════════════════════════════════════════════════════
// FORMATION LABEL
// ═══════════════════════════════════════════════════════════
const labelEl  = document.getElementById('formation-label');
const symbolEl = document.getElementById('formation-symbol');
const nameEl   = document.getElementById('formation-name');

function updateFormationLabel() {
  const detected = classifyFormation(params);
  if (detected && detected.id === currentFormation?.id) { formationAge++; }
  else { currentFormation = detected; formationAge = 0; }

  if (currentFormation && formationAge >= FORMATION_CONFIRM) {
    const lx = Math.max(80, Math.min(simCanvas.width  - 80, clumpX));
    const ly = Math.max(60, Math.min(simCanvas.height - 60, clumpY));
    symbolEl.textContent    = currentFormation.symbol;
    nameEl.textContent      = currentFormation.name;
    labelEl.style.left      = lx + 'px';
    labelEl.style.top       = (ly + 52) + 'px';
    labelEl.style.transform = 'translate(-50%, 0)';
    labelEl.style.opacity   = '1';
    if (currentFormation.id !== lastStampedId) {
      addStamp(currentFormation, lx, ly);
      lastStampedId = currentFormation.id;
    }
  } else {
    labelEl.style.opacity = '0';
    if (!currentFormation) lastStampedId = null;
  }
}

// ═══════════════════════════════════════════════════════════
// PARAMETER PANEL
// ═══════════════════════════════════════════════════════════
function updateParamPanel() {
  const pct   = v => `${(v * 100).toFixed(0)}%`;
  const amDir = params.angularMomentum > 0.02 ? '↻' : params.angularMomentum < -0.02 ? '↺' : '·';
  document.getElementById('val-collapse').textContent = `${pct(params.collapseStrength)}  (G = ${(params.collapseStrength * params.massAmount).toFixed(2)})`;
  document.getElementById('bar-collapse').style.width = pct(params.collapseStrength);
  document.getElementById('val-angular').textContent  = `${pct(Math.abs(params.angularMomentum))}  ${amDir}`;
  document.getElementById('bar-angular').style.width  = pct(Math.abs(params.angularMomentum));
  document.getElementById('val-turb').textContent     = pct(params.turbulence);
  document.getElementById('bar-turb').style.width     = pct(params.turbulence);
  document.getElementById('val-mass').textContent     = `${params.massAmount.toFixed(2)} M☉`;
  document.getElementById('bar-mass').style.width     = `${((params.massAmount - 0.4) / 1.2) * 100}%`;
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
let camReady = false;

function drawCamera() {
  if (!camReady || video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const cw = camCanvas.width, ch = camCanvas.height;
  const scale = Math.max(cw / vw, ch / vh);
  const dw = vw * scale, dh = vh * scale;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  camCtx.save();
  camCtx.translate(cw, 0);
  camCtx.scale(-1, 1);
  camCtx.drawImage(video, cw - dx - dw, dy, dw, dh);
  camCtx.restore();
}

function drawParticles() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, simCanvas.width, simCanvas.height);
  ctx.globalCompositeOperation = 'source-over';

  const maxD = Math.min(simCanvas.width, simCanvas.height) * 0.44;

  if (ignitionLevel > 0.04) {
    const rad = 180 * ignitionLevel;
    const grd = ctx.createRadialGradient(clumpX, clumpY, 0, clumpX, clumpY, rad);
    grd.addColorStop(0,    `rgba(255,230,160,${0.70 * ignitionLevel})`);
    grd.addColorStop(0.35, `rgba(240,190,100,${0.35 * ignitionLevel})`);
    grd.addColorStop(1,    'rgba(220,170,80,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(clumpX, clumpY, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  const cs = params.collapseStrength;
  for (const p of particles) {
    const dx = p.x - clumpX, dy = p.y - clumpY;
    const close = Math.max(0, 1 - Math.sqrt(dx*dx + dy*dy) / maxD);
    let r, g, b;
    if (ignitionLevel > 0.08 && close > 0.45) {
      const t = Math.pow((close - 0.45) / 0.55, 1.3) * ignitionLevel;
      r = Math.round(200 + (255 - 200) * t);
      g = Math.round(200 + (220 - 200) * t);
      b = Math.round(200 + (130 - 200) * t);
    } else {
      const bri = Math.round(200 + 55 * close * cs + 30 * close);
      r = g = b = Math.min(255, bri);
    }
    ctx.globalAlpha = 0.55 + close * 0.45;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 0.7 + close * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function loop() {
  drawCamera();
  tick();
  drawParticles();
  updateFormationLabel();
  updateParamPanel();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════
// HAND SKELETON — drawn onto #hand-overlay, mirrored to match video
// ═══════════════════════════════════════════════════════════
function drawSkeleton(landmarks) {
  // Mirror X to match the flipped camera feed
  const W = handOverlay.width, H = handOverlay.height;
  const pts = landmarks.map(lm => ({ x: (1 - lm.x) * W, y: lm.y * H }));

  // Connections: [from, to] index pairs from MediaPipe HAND_CONNECTIONS
  const CONNECTIONS = [
    [0,1],[1,2],[2,3],[3,4],
    [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12],
    [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],
    [0,17]
  ];

  handCtx.strokeStyle = 'rgba(232,25,125,0.65)';
  handCtx.lineWidth   = 2;
  handCtx.lineCap     = 'round';
  for (const [a, b] of CONNECTIONS) {
    handCtx.beginPath();
    handCtx.moveTo(pts[a].x, pts[a].y);
    handCtx.lineTo(pts[b].x, pts[b].y);
    handCtx.stroke();
  }

  // Landmark dots
  for (const pt of pts) {
    handCtx.beginPath();
    handCtx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
    handCtx.fillStyle   = 'rgba(255,255,255,0.85)';
    handCtx.strokeStyle = 'rgba(232,25,125,0.9)';
    handCtx.lineWidth   = 1.5;
    handCtx.fill();
    handCtx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
// MEDIAPIPE HANDS
// ═══════════════════════════════════════════════════════════
let prevRX = null, prevRY = null, rVelBuf = [];

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}`
});
hands.setOptions({ maxNumHands: 2, modelComplexity: 1,
  minDetectionConfidence: 0.65, minTrackingConfidence: 0.55 });

hands.onResults(results => {
  // Clear skeleton overlay each frame
  handCtx.clearRect(0, 0, handOverlay.width, handOverlay.height);

  const lms  = results.multiHandLandmarks || [];
  const hdns = results.multiHandedness    || [];

  // Draw skeleton for every detected hand
  lms.forEach(landmarks => drawSkeleton(landmarks));

  // MP labels are mirrored: 'Right' in data = user's physical left
  let leftLM = null, rightLM = null;
  for (let i = 0; i < hdns.length; i++) {
    if (hdns[i].label === 'Right') leftLM  = lms[i];
    if (hdns[i].label === 'Left')  rightLM = lms[i];
  }

  if (!leftLM)  params.collapseStrength = smooth(params.collapseStrength, 0, 0.05);
  if (!rightLM) {
    params.angularMomentum = smooth(params.angularMomentum, 0, 0.05);
    params.turbulence      = smooth(params.turbulence, 0, 0.05);
    prevRX = null; prevRY = null;
  }

  if (leftLM) {
    params.massX      = 1 - leftLM[0].x;
    params.massY      = leftLM[0].y;
    params.massAmount = Math.max(0.4, Math.min(1.6, 1.0 - leftLM[0].z * 2.5));
    const t = leftLM[4], idx = leftLM[8];
    const pd  = Math.hypot(t.x - idx.x, t.y - idx.y);
    const tgt = Math.max(0, Math.min(1, 1 - (pd - 0.03) / 0.19));
    params.collapseStrength = smooth(params.collapseStrength, tgt, 0.20);
  }

  if (rightLM) {
    const wr = rightLM[0], mm = rightLM[9];
    const angle = Math.atan2(mm.y - wr.y, mm.x - wr.x);
    const tgtAM = Math.max(-1, Math.min(1, Math.sin(angle + Math.PI / 2) * 1.4));
    params.angularMomentum = smooth(params.angularMomentum, tgtAM, 0.13);

    const rx = rightLM[0].x, ry = rightLM[0].y;
    if (prevRX !== null) {
      const vel = Math.hypot(rx - prevRX, ry - prevRY);
      rVelBuf.push(vel);
      if (rVelBuf.length > 8) rVelBuf.shift();
      const avg = rVelBuf.reduce((a, b) => a + b, 0) / rVelBuf.length;
      params.turbulence = smooth(params.turbulence, Math.min(1, avg / 0.032), 0.22);
    }
    prevRX = rx; prevRY = ry;
  }
});

// ═══════════════════════════════════════════════════════════
// CAMERA — direct getUserMedia, feeds MediaPipe each frame
// ═══════════════════════════════════════════════════════════
async function startSimCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await new Promise(res => { video.onloadedmetadata = res; });
    await video.play();
    camReady = true;

    async function sendFrame() {
      if (video.readyState >= 2) await hands.send({ image: video });
      if (video.requestVideoFrameCallback) {
        video.requestVideoFrameCallback(sendFrame);
      }
    }
    if (video.requestVideoFrameCallback) {
      video.requestVideoFrameCallback(sendFrame);
    } else {
      setInterval(async () => {
        if (video.readyState >= 2) await hands.send({ image: video });
      }, 1000 / 30);
    }
  } catch (e) {
    console.warn('Camera unavailable:', e);
    camReady = false;
  }
}
startSimCamera();

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
clumpX = simCanvas.width  / 2;
clumpY = simCanvas.height / 2;
initParticles();
loop();
</script>
</body>
</html>
